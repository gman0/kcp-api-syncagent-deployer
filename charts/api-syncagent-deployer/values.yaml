nameOverride: ""
fullnameOverride: ""

# Install the PublishedResource CRD from this chart. Enabled so users can
# create PublishedResource templates before any kubeconfig Secret exists.
# Set to false if the CRD is managed elsewhere (e.g. by a standalone
# api-syncagent install on the same cluster).
crds:
  install: true

# Required: name of the APIExportEndpointSlice this deployer binds every
# managed api-syncagent HelmRelease to.
apiExportEndpointSliceName: ""

# Optional label selector; only Secrets matching it will be reconciled.
# Empty string means all Secrets are reconciled.
# Example: "apisyncagent.platform-mesh.io/kubeconfig=true"
secretLabelSelector: ""

replicas: 1

image:
  repository: ghcr.io/platform-mesh/api-syncagent-deployer
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

leaderElection:
  enabled: true
  id: kcp-api-syncagent-deployer

ports:
  metrics: 9080
  probes: 8080

extraArgs: []

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

serviceAccount:
  create: true
  name: ""
  annotations: {}

rbac:
  create: true

podAnnotations: {}
podLabels: {}
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  readOnlyRootFilesystem: true

nodeSelector: {}
affinity: {}
tolerations: []
